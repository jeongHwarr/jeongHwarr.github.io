  <ol class="gm-caps">
    <li>① 결과 품질: GAN과 Diffusion은 선명한 이미지를 만듭니다. VAE는 세부가 뭉개져 결과가 흐릿합니다.</li>

    <li>④ 학습 안정성: VAE와 Diffusion은 하나의 정해진 학습 목표에 따라 오차를 줄이므로 학습이 안정적입니다. GAN은 두 신경망의 균형이 깨지면 학습이 불안정해집니다. 세 모델 모두 약점이 하나씩 있습니다.</li>
