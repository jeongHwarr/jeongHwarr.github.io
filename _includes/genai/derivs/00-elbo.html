{% raw %}
<div class="gm-deriv tex2jax_ignore" data-gm="deriv">
<script type="application/json">
{"legend":{"blue":"q(z|x) 근사 분포","violet":"p(z|x) 실제 사후분포","cyan":"p(x,z) 결합 분포"},
 "rows":[
  {"l":[{"id":"lhs","tex":"\\log p(x)"}],
   "r":[{"id":"eq","tex":"="},{"id":"log","tex":"\\log"},{"id":"px","tex":"p(x)"},{"id":"op","tex":"\\int q(z\\mid x)\\,dz","f":"blue","new":true,"note":"= 1"}],
   "short":"1을 곱함 (∫q dz = 1)","long":"q(z|x)는 z에 대한 확률분포이므로 z 전체에 대해 적분하면 1입니다. log p(x)에 1을 곱했으니 값은 같습니다."},
  {"l":[],
   "r":[{"id":"eq","tex":"="},{"id":"op","tex":"\\mathbb{E}_{q(z\\mid x)}","f":"blue","new":true},{"id":"lb","tex":"\\Big["},{"id":"log","tex":"\\log"},{"id":"px","tex":"p(x)"},{"id":"rb","tex":"\\Big]"}],
   "short":"기댓값으로 바꿈","long":"log p(x)는 z와 무관하므로 적분 안으로 넣을 수 있습니다. q(z|x)를 곱해 z에 대해 적분한 값은 q(z|x)에 대한 기댓값입니다."},
  {"l":[],
   "r":[{"id":"eq","tex":"="},{"id":"op","tex":"\\mathbb{E}_{q}"},{"id":"lb","tex":"\\Bigg["},{"id":"log","tex":"\\log"},
        {"frac":"f1","num":[{"id":"px","tex":"p(x,z)","f":"cyan","new":true}],"den":[{"id":"pzx","tex":"p(z\\mid x)","f":"violet","new":true}]},
        {"id":"rb","tex":"\\Bigg]"}],
   "short":"베이즈 정리","long":"베이즈 정리에 따라 p(x) = p(x,z) / p(z|x)이므로 p(x)를 이 분수로 바꿉니다."},
  {"l":[],
   "r":[{"id":"eq","tex":"="},{"id":"op","tex":"\\mathbb{E}_{q}"},{"id":"lb","tex":"\\Bigg["},{"id":"log","tex":"\\log"},
        {"frac":"f1","num":[{"id":"px","tex":"p(x,z)","f":"cyan"}],"den":[{"id":"q1","tex":"q(z\\mid x)","f":"blue","new":true}]},
        {"id":"dot","tex":"\\cdot","new":true},
        {"frac":"f2","num":[{"id":"q2","tex":"q(z\\mid x)","f":"blue","new":true}],"den":[{"id":"pzx","tex":"p(z\\mid x)","f":"violet"}]},
        {"id":"rb","tex":"\\Bigg]"}],
   "short":"q/q = 1을 곱함","long":"q(z|x) / q(z|x), 즉 1을 곱합니다. 값은 같고, 분수를 p(x,z) / q(z|x)와 q(z|x) / p(z|x) 두 개로 나눌 수 있게 됩니다."},
  {"l":[],
   "r":[{"id":"eq","tex":"="},{"id":"op","tex":"\\mathbb{E}_{q}"},{"id":"lb","tex":"\\Bigg["},{"id":"log","tex":"\\log"},
        {"frac":"f1","num":[{"id":"px","tex":"p(x,z)","f":"cyan"}],"den":[{"id":"q1","tex":"q(z\\mid x)","f":"blue"}]},
        {"id":"rb","tex":"\\Bigg]"},{"id":"dot","tex":"+","new":true},
        {"id":"op2","tex":"\\mathbb{E}_{q}","new":true,"from":"op"},{"id":"lb2","tex":"\\Bigg[","from":"lb"},{"id":"log2","tex":"\\log","new":true,"from":"log"},
        {"frac":"f2","num":[{"id":"q2","tex":"q(z\\mid x)","f":"blue"}],"den":[{"id":"pzx","tex":"p(z\\mid x)","f":"violet"}]},
        {"id":"rb2","tex":"\\Bigg]","from":"rb"}],
   "short":"log의 곱 → 합","long":"log(ab) = log a + log b이고, 합의 기댓값은 기댓값의 합입니다. 그래서 기댓값 두 개의 합이 됩니다."},
  {"l":[],
   "r":[{"id":"eq","tex":"="},
        {"group":"elbo","label":"ELBO","items":[{"id":"op","tex":"\\mathbb{E}_{q}"},{"id":"lb","tex":"\\Bigg["},{"id":"log","tex":"\\log"},
          {"frac":"f1","num":[{"id":"px","tex":"p(x,z)","f":"cyan"}],"den":[{"id":"q1","tex":"q(z\\mid x)","f":"blue"}]},{"id":"rb","tex":"\\Bigg]"}]},
        {"id":"dot","tex":"+"},
        {"id":"kl","tex":"D_{\\mathrm{KL}}\\big(q(z\\mid x)\\,\\|\\,p(z\\mid x)\\big)","f":"violet","new":true,"note":"≥ 0","absorb":["op2","lb2","log2","q2","pzx","rb2"]}],
   "short":"KL 발산의 정의","long":"두 번째 기댓값은 q(z|x)와 p(z|x) 사이의 KL 발산과 정의가 같습니다. 첫 번째 항을 ELBO(Evidence Lower Bound)라고 부릅니다."},
  {"l":[{"id":"lhs","tex":"\\log p(x)"}],
   "r":[{"id":"eq","tex":"\\ge","f":"key","new":true},{"id":"elboT","tex":"\\text{ELBO}","f":"key","new":true,"absorb":["op","lb","log","px","q1","rb"]}],
   "short":"KL ≥ 0","long":"KL 발산은 0 이상이므로 log p(x)는 ELBO보다 작아질 수 없습니다. KL 항에는 계산할 수 없는 p(z|x)가 들어 있어서, 학습에서는 계산할 수 있는 ELBO를 최대화합니다."},
  {"l":[{"id":"elboT","tex":"\\text{ELBO}","f":"key"}],
   "r":[{"id":"eq","tex":"="},{"id":"op","tex":"\\mathbb{E}_{q}"},{"id":"lb","tex":"\\Bigg["},{"id":"log","tex":"\\log"},
        {"frac":"f1","num":[{"id":"px","tex":"p(x\\mid z)\\,p(z)","f":"cyan","new":true}],"den":[{"id":"q1","tex":"q(z\\mid x)","f":"blue"}]},
        {"id":"rb","tex":"\\Bigg]"}],
   "short":"p(x,z) = p(x|z)p(z)","long":"ELBO만 따로 풀어 씁니다. 분자의 결합 확률 p(x,z)를 p(x|z)p(z)로 나눕니다."},
  {"l":[],
   "r":[{"id":"eq","tex":"="},
        {"id":"rec","tex":"\\mathbb{E}_{q}\\big[\\log p(x\\mid z)\\big]","f":"cyan","new":true,"note":"복원 항","absorb":["op","lb","log","px"]},
        {"id":"minus","tex":"-","new":true},
        {"id":"reg","tex":"D_{\\mathrm{KL}}\\big(q(z\\mid x)\\,\\|\\,p(z)\\big)","f":"blue","new":true,"c":"blue","note":"정규화 항","absorb":["q1","rb"]}],
   "short":"로그를 둘로 나눔","long":"로그를 log p(x|z)와 log p(z) / q(z|x)로 나누면 앞은 <b class=\"gm-k-key\">복원 항</b>, 뒤는 부호가 바뀐 KL 발산인 <b class=\"gm-k-blue\">정규화 항</b>입니다. VAE는 복원 항을 키우고 정규화 항을 줄이도록 학습합니다."}
 ]}
</script>
</div>
